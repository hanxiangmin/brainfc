name: CI
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples scripts

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            network-frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: network-frontend
      - run: npm run check && npm test && npm run build
        working-directory: network-frontend
      - run: python scripts/generate_reference.py --check
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/check_release.py --dist dist
      - run: python scripts/smoke_wheel.py --wheel-dir dist
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: .work/release-browser

