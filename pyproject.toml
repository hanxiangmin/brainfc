[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brainfc"
dynamic = ["version"]
description = "Resting-state fMRI functional connectivity, connectome and brain network / hypergraph analysis with Python and a local GUI"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/brainfc/web/static/THIRD_PARTY_NOTICES.txt", "src/brainfc/network/web/static/THIRD_PARTY_NOTICES.txt"]
authors = [{name = "BrainFC contributors"}]
keywords = [
  "fmri", "resting-state-fmri", "rs-fmri", "functional-connectivity", "connectivity-matrix",
  "brain-network", "brain-connectivity", "connectome", "connectomics", "neuroimaging",
  "neuroscience", "hypergraph", "hypergraph-analysis", "network-analysis", "brain-visualization",
  "roi-timeseries", "nifti", "cifti", "bids", "静息态fMRI", "功能连接", "功能连接矩阵", "脑网络", "超图分析",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "nibabel>=5.2", "nilearn>=0.14,<0.15", "scikit-learn>=1.4", "matplotlib>=3.8", "scikit-image>=0.23", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.20", "networkx>=3.2", "xgi>=0.9", "statsmodels>=0.14", "h5py>=3.10", "platformdirs>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2", "twine>=6", "ruff>=0.9", "hatchling>=1.27", "PyYAML>=6", "Markdown>=3.6", "pydicom>=3"]

[project.scripts]
brainfc = "brainfc.cli:main"
hicbrain = "brainfc.network.cli:main"

[project.urls]
Homepage = "https://github.com/hanxiangmin/brainfc"
Source = "https://github.com/hanxiangmin/brainfc"
Issues = "https://github.com/hanxiangmin/brainfc/issues"
Documentation = "https://github.com/hanxiangmin/brainfc/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/brainfc", "src/hicbrain"]

[tool.hatch.version]
path = "src/brainfc/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/frontend", "/network-frontend", "/tests", "/examples", "/docs", "/scripts", "/.github", "/.gitignore", "/.gitattributes", "/README.md", "/README.en.md", "/PYPI.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/CITATION.cff", "/SECURITY.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/启动界面.cmd"]
exclude = ["**/node_modules", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
